<!doctype html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" crossorigin href="./assets/index-DLMedW-6.css">
</head>
<body class="min-h-screen bg-canvas text-ink antialiased">
  <div class="min-h-screen lg:flex">
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 flex w-65 -translate-x-full flex-col border-r border-stone-200/80 bg-white px-5 py-6 transition-transform duration-200 lg:static lg:translate-x-0">
      <a href="#" class="mb-9 flex items-center gap-3 px-2" aria-label="Rihlah beranda">
        <span class="grid h-11 w-11 place-items-center rounded-2xl bg-brand-700 text-white shadow-sm">
          <svg viewBox="0 0 24 24" fill="none" class="h-6 w-6" aria-hidden="true"><path d="M12 3.5 4 8v8l8 4.5 8-4.5V8l-8-4.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m8 10.1 4 2.3 4-2.3M12 12.5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </span>
        <span><span class="font-display block text-lg font-extrabold tracking-tight">rihlah<span class="text-brand-600">.</span></span><span class="block text-[11px] font-medium tracking-wide text-stone-400">UMROH BUSINESS SUITE</span></span>
      </a>
      <p class="mb-3 px-3 text-[10px] font-bold uppercase tracking-[.17em] text-stone-400">Workspace</p>
      <nav class="space-y-1" aria-label="Navigasi utama">
        <button data-page="overview" class="nav-link active flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm text-stone-600 transition hover:bg-stone-50">
          <svg class="nav-icon h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/></svg>Ringkasan
        </button>
        <p class="mb-2 mt-7 px-3 text-[10px] font-bold uppercase tracking-[.17em] text-stone-400">Rincian biaya</p>
        <button data-page="hotel" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm text-stone-600 transition hover:bg-stone-50"><svg class="nav-icon h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 20V7.5A2.5 2.5 0 0 1 6 5h12a2.5 2.5 0 0 1 2.5 2.5V20M3.5 15h17M7 10h3m4 0h3m-10 5v5m10-5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Hotel</button>
        <button data-page="apartments" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm text-stone-600 transition hover:bg-stone-50"><svg class="nav-icon h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 20V5.8A1.8 1.8 0 0 1 6.3 4h11.4a1.8 1.8 0 0 1 1.8 1.8V20M8 8h2m4 0h2m-8 4h2m4 0h2M10 20v-4h4v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Apartemen</button>
        <button data-page="transport" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm text-stone-600 transition hover:bg-stone-50"><svg class="nav-icon h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 14.5h18l-1.6-5.2a2 2 0 0 0-1.9-1.4H6.5a2 2 0 0 0-1.9 1.4L3 14.5ZM5 14.5v3h2m12-3v3h-2M7 17.5h10M7 11h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Transportasi</button>
        <button data-page="other-costs" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm text-stone-600 transition hover:bg-stone-50"><svg class="nav-icon h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.5v17m5-13H9.8a2.8 2.8 0 1 0 0 5.6h4.4a2.8 2.8 0 1 1 0 5.6H6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Biaya lainnya</button>
        <p class="mb-2 mt-7 px-3 text-[10px] font-bold uppercase tracking-[.17em] text-stone-400">Untuk jamaah</p>
        <button data-page="offer" class="nav-link flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm text-stone-600 transition hover:bg-stone-50"><svg class="nav-icon h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3.5h7l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1ZM14 3.5V8h4m-9 5h6m-6 4h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Penawaran paket</button>
      </nav>
      <div class="mt-auto rounded-2xl bg-brand-50 p-4">
        <div class="mb-2 flex items-center gap-2 text-brand-700"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v5m0-8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="text-xs font-bold">Tips singkat</span></div>
        <p class="text-xs leading-relaxed text-stone-600">Isi akomodasi dan alokasi jamaah agar HPP serta harga jual bisa dihitung.</p>
        <div class="mt-3 flex items-center gap-2 text-[10px] text-stone-400"><span class="h-1.5 w-1.5 rounded-full bg-brand-500"></span>Data tersimpan otomatis</div>
      </div>
    </aside>
    <div id="sidebar-backdrop" class="fixed inset-0 z-20 hidden bg-ink/30 lg:hidden"></div>
    <div class="min-w-0 flex-1">
      <header class="sticky top-0 z-10 flex h-[72px] items-center justify-between border-b border-stone-200/80 bg-white/90 px-5 backdrop-blur-md sm:px-8">
        <div class="flex items-center gap-3">
          <button id="menu-button" class="grid h-10 w-10 place-items-center rounded-xl text-stone-500 hover:bg-stone-100 lg:hidden" aria-label="Buka menu"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <div><p class="text-[11px] font-medium text-stone-400">Workspace <span class="mx-1">/</span> <span id="breadcrumb">Ringkasan</span></p><h1 id="page-title" class="font-display text-sm font-bold text-ink sm:text-base">Ringkasan paket</h1></div>
        </div>
        <div class="flex items-center gap-3">
          <span id="save-state" class="hidden items-center gap-1.5 text-xs text-stone-400 sm:flex"><span class="h-1.5 w-1.5 rounded-full bg-brand-500"></span>Tersimpan</span>
          <span class="grid h-9 w-9 place-items-center rounded-full bg-sand text-xs font-bold text-brand-700">RH</span>
        </div>
      </header>
      <main id="app" class="mx-auto max-w-[1440px] px-5 py-7 sm:px-8 sm:py-9"></main>
      <footer class="mx-auto max-w-[1440px] px-5 pb-7 text-center text-[11px] text-stone-400 sm:px-8">Rihlah · Kalkulator biaya perjalanan umroh</footer>
    </div>
  </div>
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden rounded-xl bg-ink px-4 py-3 text-sm text-white shadow-lg" role="status" aria-live="polite"></div>
  <script>
    const STORAGE_KEY = "rihlah-umrah-calculator-v1";
    const initialData = {
      company: "Travel Umroh", packageName: "Paket Umroh", departure: "",
      pax: 20, exchange: 4500, exchangeSource: "api", exchangeUpdatedAt: "", markup: 10, nightsMakkah: 5, nightsMadinah: 5, duration: 12,
      direct: { visa: 0, flight: 0, zamzam: 0, porter: 0 },
      shared: { airport: 0, hotel: 0, guide: 0, other: 0 },
      hotels: [], apartments: [], transport: []
    };
    const clone = value => JSON.parse(JSON.stringify(value));
    let data;
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      data = saved && typeof saved === "object" ? { ...clone(initialData), ...saved,
        exchangeSource: saved.exchangeSource === "manual" ? "manual" : "api",
        exchangeUpdatedAt: typeof saved.exchangeUpdatedAt === "string" ? saved.exchangeUpdatedAt : "",
        direct: { ...initialData.direct, ...(saved.direct || {}) },
        shared: { ...initialData.shared, ...(saved.shared || {}) },
        hotels: Array.isArray(saved.hotels) ? saved.hotels.filter(row => row && typeof row === "object") : [],
        apartments: Array.isArray(saved.apartments) ? saved.apartments.filter(row => row && typeof row === "object") : [],
        transport: Array.isArray(saved.transport) ? saved.transport.filter(row => row && typeof row === "object") : [] } : clone(initialData);
    } catch (error) {
      data = clone(initialData);
      console.error("Data tersimpan tidak dapat dibaca:", error);
    }
    const app = document.getElementById("app");
    let exchangeLoading = false;
    let exchangeError = "";
    let exchangeRequestId = 0;
    const labels = {
      overview: ["Ringkasan", "Ringkasan paket"],
      hotel: ["Hotel", "Akomodasi hotel"],
      apartments: ["Apartemen", "Akomodasi apartemen"],
      transport: ["Transportasi", "Transportasi"],
      "other-costs": ["Biaya lainnya", "Biaya & pengaturan"],
      offer: ["Penawaran paket", "Penawaran untuk jamaah"]
    };
    let currentPage = "overview";
    let saveTimer;
    let toastTimer;
    const id = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
    const num = value => Number.isFinite(Number(value)) ? Math.max(0, Number(value)) : 0;
    const fmt = (value, currency = "SAR") => new Intl.NumberFormat("id-ID", {
      style: "currency", currency, maximumFractionDigits: 0
    }).format(Number.isFinite(value) ? value : 0);
    const integer = value => new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 }).format(value || 0);
    const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
    const iconPlus = '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14m-7-7h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
    const iconArrow = '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const iconTrash = '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 7h15m-10 0V4.5h5V7m3.5 0-.8 13h-9.4L7 7m3.5 3.5v6m3-6v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const pageHeading = (eyebrow, title, description, button = "") => `
      <div class="mb-7 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
        <div><p class="mb-2 text-xs font-bold uppercase tracking-[.14em] text-brand-600">${eyebrow}</p><h2 class="font-display text-2xl font-extrabold tracking-tight text-ink sm:text-[28px]">${title}</h2><p class="mt-2 max-w-2xl text-sm leading-relaxed text-stone-500">${description}</p></div>
        ${button}
      </div>`;
    const button = (text, action, primary = true) => `<button data-action="${action}" class="${primary ? "bg-brand-700 text-white shadow-sm hover:bg-brand-900" : "border border-stone-200 bg-white text-stone-600 hover:bg-stone-50"} inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition">${primary ? iconPlus : ""}${text}</button>`;
    const input = (label, key, value, options = {}) => `
      <label class="block min-w-0">
        <span class="field-label">${label}${options.hint ? `<span class="ml-1 font-normal text-stone-400">${options.hint}</span>` : ""}</span>
        <div class="relative">
          ${options.prefix ? `<span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-xs font-semibold text-stone-400">${options.prefix}</span>` : ""}
          <input class="input-control ${options.prefix ? "pl-11" : ""} ${options.suffix ? "pr-10" : ""}" type="${options.type || "number"}" ${options.type === "number" ? `min="${options.min ?? 0}" step="${options.step || "any"}"` : ""} value="${escapeHTML(value ?? "")}" placeholder="${options.placeholder || ""}" data-scope="${options.scope || "settings"}" data-key="${key}" aria-label="${label}">
          ${options.suffix ? `<span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-xs font-semibold text-stone-400">${options.suffix}</span>` : ""}
        </div>
      </label>`;
    const card = content => `<section class="rounded-2xl border border-stone-200/80 bg-white p-5 shadow-soft sm:p-6">${content}</section>`;
    const summary = () => {
      const hotelRows = data.hotels.map(row => ({ kind: "hotel", row, cost: num(row.price) * num(row.nights) * num(row.rooms), people: num(row.pax), cap: num(row.rooms) * num(row.capacity), accomPerPax: num(row.pax) ? num(row.price) * num(row.nights) * num(row.rooms) / num(row.pax) : 0 }));
      const apartmentRows = data.apartments.map(row => ({ kind: "apartments", row, cost: num(row.price) * num(row.units), people: num(row.pax), cap: num(row.units) * num(row.capacity), accomPerPax: num(row.pax) ? num(row.price) * num(row.units) / num(row.pax) : 0 }));
      const rows = [...hotelRows, ...apartmentRows];
      const transportTotal = data.transport.reduce((sum, row) => sum + num(row.price) * num(row.units), 0);
      const sharedTotal = Object.values(data.shared).reduce((sum, value) => sum + num(value), 0);
      const directPerPax = Object.values(data.direct).reduce((sum, value) => sum + num(value), 0);
      const commonPerPax = num(data.pax) ? (sharedTotal + transportTotal) / num(data.pax) + directPerPax : 0;
      rows.forEach(item => {
        item.mealPerPax = num(item.row.meal) * num(item.row.mealDays);
        item.costTotal = item.people ? item.cost + item.people * (item.mealPerPax + commonPerPax) : 0;
        item.costPerPax = item.people ? item.costTotal / item.people : 0;
        item.sellPerPax = item.costPerPax * (1 + num(data.markup) / 100);
        item.sellTotal = item.sellPerPax * item.people;
      });
      const costTotal = rows.reduce((sum, item) => sum + item.costTotal, 0);
      const revenue = rows.reduce((sum, item) => sum + item.sellTotal, 0);
      const allocated = rows.reduce((sum, item) => sum + item.people, 0);
      const hasLodging = rows.some(item => item.cost > 0 || item.people > 0);
      const issues = rows.filter(item => item.people > item.cap || (item.cost > 0 && !item.people)).length;
      return { rows, transportTotal, sharedTotal, directPerPax, commonPerPax, costTotal, revenue, profit: revenue - costTotal, allocated, hasLodging, issues, hppPerPax: num(data.pax) ? costTotal / num(data.pax) : 0, sellPerPax: num(data.pax) ? revenue / num(data.pax) : 0 };
    };
    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        const status = document.getElementById("save-state");
        status.classList.remove("hidden");
        status.classList.add("sm:flex");
      } catch (error) {
        console.error("Perubahan tidak dapat disimpan:", error);
        showToast("Perubahan belum tersimpan. Periksa ruang penyimpanan browser.");
      }
    }
    function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.remove("hidden");
      toast.classList.add("toast");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add("hidden"), 2600);
    }
    function exchangeStatusText() {
      if (exchangeLoading) return "Mengambil kurs terbaru dari API…";
      if (exchangeError) return "API tidak tersedia. Kurs tersimpan tetap digunakan.";
      const date = data.exchangeUpdatedAt ? new Date(`${data.exchangeUpdatedAt}T00:00:00`) : null;
      const dateText = date && !Number.isNaN(date.getTime())
        ? date.toLocaleDateString("id-ID", { day:"numeric", month:"short", year:"numeric" })
        : "";
      if (data.exchangeSource === "manual") {
        return dateText ? `Kurs manual · data API terakhir ${dateText}` : "Kurs manual";
      }
      return dateText ? `Kurs API · data ${dateText}` : "Menunggu kurs dari API";
    }
    function updateExchangeStatus() {
      const status = document.getElementById("exchange-status");
      if (status) {
        status.textContent = exchangeStatusText();
        status.className = `text-[11px] ${exchangeError ? "text-rose-600" : exchangeLoading ? "text-brand-600" : "text-stone-400"}`;
      }
      const refreshButton = document.getElementById("exchange-refresh-button");
      if (refreshButton) {
        refreshButton.disabled = exchangeLoading;
        refreshButton.textContent = exchangeLoading ? "Memuat…" : "Perbarui kurs";
        refreshButton.classList.toggle("cursor-wait", exchangeLoading);
        refreshButton.classList.toggle("opacity-60", exchangeLoading);
      }
    }
    async function refreshExchangeRate(notify = false) {
      if (exchangeLoading) return;
      const requestId = ++exchangeRequestId;
      exchangeLoading = true;
      exchangeError = "";
      updateExchangeStatus();
      const endpoints = [
        "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/sar.json",
        "https://latest.currency-api.pages.dev/v1/currencies/sar.json"
      ];
      let rate;
      let rateDate = "";
      let lastError;
      try {
        for (const endpoint of endpoints) {
          try {
            const response = await fetch(endpoint, { cache:"no-store", signal:AbortSignal.timeout(10000) });
            if (!response.ok) throw new Error(`API kurs merespons HTTP ${response.status}`);
            const payload = await response.json();
            const parsedRate = Number(payload?.sar?.idr);
            if (!Number.isFinite(parsedRate) || parsedRate <= 0) throw new Error("Respons API tidak berisi kurs SAR/IDR yang valid");
            if (requestId !== exchangeRequestId) return;
            rate = parsedRate;
            rateDate = typeof payload.date === "string" ? payload.date : new Date().toISOString().slice(0, 10);
            break;
          } catch (error) {
            if (requestId !== exchangeRequestId) return;
            lastError = error;
            console.warn(`Gagal mengambil kurs dari ${endpoint}:`, error);
          }
        }
        if (rate === undefined) throw lastError || new Error("Kurs SAR/IDR tidak tersedia");
        data.exchange = rate;
        data.exchangeSource = "api";
        data.exchangeUpdatedAt = rateDate;
        save();
        if (notify) showToast(`Kurs diperbarui: ${fmt(rate, "IDR")} per SAR.`);
      } catch (error) {
        if (requestId !== exchangeRequestId) return;
        exchangeError = "Kurs API gagal dimuat";
        console.error("Kurs otomatis tidak dapat diperbarui:", error);
        showToast("Kurs API gagal dimuat. Kurs tersimpan tetap digunakan; periksa koneksi atau coba lagi.");
      } finally {
        if (requestId === exchangeRequestId) {
          exchangeLoading = false;
          updateExchangeStatus();
          if (currentPage === "other-costs" || currentPage === "overview" || currentPage === "offer") render();
        }
      }
    }
    function statusBadge(item) {
      const status = item.people > item.cap ? "Melebihi kapasitas" : item.cost > 0 && !item.people ? "Isi alokasi pax" : item.cost > 0 || item.people > 0 ? "Sesuai" : "Belum diisi";
      const color = status === "Sesuai" ? "bg-emerald-50 text-emerald-700" : status === "Belum diisi" ? "bg-stone-100 text-stone-500" : "bg-amber-50 text-amber-700";
      return `<span class="inline-flex whitespace-nowrap rounded-full px-2.5 py-1 text-[11px] font-semibold ${color}">${status}</span>`;
    }
    const numberCell = (row, field, value, label, opts = {}) => `<input class="input-control table-input ${opts.align ? "text-right" : ""}" type="number" min="0" step="${opts.step || "any"}" value="${escapeHTML(value ?? 0)}" data-scope="${row.kind}" data-id="${row.id}" data-key="${field}" aria-label="${label}">`;
    const textCell = (row, field, value, label, placeholder = "") => `<input class="input-control table-input" type="text" value="${escapeHTML(value ?? "")}" placeholder="${placeholder}" data-scope="${row.kind}" data-id="${row.id}" data-key="${field}" aria-label="${label}">`;
    function renderTable(kind) {
      const config = {
        hotel: { title: "Daftar hotel", rows: data.hotels, empty: "Belum ada hotel. Tambahkan hotel untuk mulai menghitung biaya kamar.", add: "Tambah hotel",
          heads: ["Kota & hotel", "Kategori", "Tarif / kamar / malam (SAR)", "Malam", "Kamar", "Pax aktual", "Kapasitas / kamar", "Konsumsi / pax / hari (SAR)", "Hari konsumsi", "HPP / pax", "Status"],
          row: row => { const item = summary().rows.find(x => x.kind === "hotel" && x.row.id === row.id) || { cost: num(row.price)*num(row.nights)*num(row.rooms), people:num(row.pax), cap:num(row.rooms)*num(row.capacity), accomPerPax: num(row.pax) ? num(row.price)*num(row.nights)*num(row.rooms)/num(row.pax) : 0, costPerPax:0 }; return `<tr><td>${textCell({ ...row, kind }, "city", row.city, "Kota", "Makkah / Madinah")}</td><td>${textCell({ ...row, kind }, "category", row.category, "Kategori", "Quad / Triple")}</td><td>${numberCell({ ...row, kind }, "price", row.price, "Tarif kamar per malam", { align:true })}</td><td>${numberCell({ ...row, kind }, "nights", row.nights, "Jumlah malam", { align:true })}</td><td>${numberCell({ ...row, kind }, "rooms", row.rooms, "Jumlah kamar", { align:true })}</td><td>${numberCell({ ...row, kind }, "pax", row.pax, "Pax aktual", { align:true })}</td><td>${numberCell({ ...row, kind }, "capacity", row.capacity, "Kapasitas per kamar", { align:true })}</td><td>${numberCell({ ...row, kind }, "meal", row.meal, "Biaya konsumsi per pax per hari", { align:true })}</td><td>${numberCell({ ...row, kind }, "mealDays", row.mealDays, "Hari konsumsi", { align:true })}</td><td class="whitespace-nowrap text-right text-xs font-semibold" data-result="${kind}:${row.id}">${fmt(item.costPerPax)}</td><td>${statusBadge(item)}<button data-action="remove-row" data-kind="${kind}" data-id="${row.id}" class="ml-2 inline-flex h-8 w-8 items-center justify-center rounded-lg text-stone-400 hover:bg-rose-50 hover:text-rose-600" aria-label="Hapus baris">${iconTrash}</button></td></tr>`; },
        },
        apartments: { title: "Daftar apartemen", rows: data.apartments, empty: "Belum ada apartemen. Tambahkan unit untuk menghitung biaya sewa.", add: "Tambah apartemen",

        <div class="no-print">${pageHeading("Untuk jamaah", "Penawaran paket umroh", "Ringkasan harga yang siap dibagikan. Data modal dan margin internal tidak ditampilkan.", '<button data-action="print" class="inline-flex items-center justify-center gap-2 rounded-xl bg-brand-700 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-900"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 8V4h10v4m-10 9H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2m-10-3h10v6H7v-6Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Cetak penawaran</button>')}</div>
        ${card(`<div class="print-card mx-auto max-w-4xl rounded-2xl border border-stone-200 bg-white p-6 shadow-soft sm:p-10">
          <div class="flex flex-col justify-between gap-5 border-b border-stone-100 pb-6 sm:flex-row sm:items-start"><div><div class="mb-3 inline-flex h-10 w-10 items-center justify-center rounded-xl bg-brand-700 text-sm font-extrabold text-white">R</div><p class="text-[10px] font-bold uppercase tracking-[.17em] text-brand-600">Penawaran perjalanan</p><h2 class="mt-1 font-display text-2xl font-extrabold tracking-tight text-ink">${escapeHTML(data.packageName || "Paket Umroh")}</h2><p class="mt-1 text-sm text-stone-500">${escapeHTML(data.company || "Travel Umroh")}</p></div><div class="rounded-xl bg-brand-50 px-4 py-3 text-left sm:text-right"><p class="text-[10px] font-bold uppercase tracking-wide text-brand-700">Mulai dari</p><p class="mt-1 font-display text-xl font-extrabold text-brand-900">${fmt(s.sellPerPax * num(data.exchange), "IDR")}<span class="ml-1 text-xs font-semibold">/ pax</span></p><p class="mt-1 text-[10px] text-brand-700">${fmt(s.sellPerPax)} per jamaah</p></div></div>
          <div class="grid grid-cols-2 gap-4 border-b border-stone-100 py-5 sm:grid-cols-4"><div><p class="text-[10px] uppercase tracking-wide text-stone-400">Keberangkatan</p><p class="mt-1 text-xs font-bold text-ink">${data.departure ? escapeHTML(new Date(`${data.departure}T00:00:00`).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})) : "Menyesuaikan"}</p></div><div><p class="text-[10px] uppercase tracking-wide text-stone-400">Durasi</p><p class="mt-1 text-xs font-bold text-ink">${integer(num(data.duration))} hari</p></div><div><p class="text-[10px] uppercase tracking-wide text-stone-400">Makkah</p><p class="mt-1 text-xs font-bold text-ink">${integer(num(data.nightsMakkah))} malam</p></div><div><p class="text-[10px] uppercase tracking-wide text-stone-400">Madinah</p><p class="mt-1 text-xs font-bold text-ink">${integer(num(data.nightsMadinah))} malam</p></div></div>
          <div class="py-6"><h3 class="mb-3 font-display text-sm font-bold text-ink">Pilihan akomodasi & harga</h3>${offerRows.length ? `<div class="overflow-x-auto"><table class="w-full min-w-[420px] text-xs"><thead><tr class="text-[10px] uppercase tracking-wide text-stone-400"><th class="pb-3 font-semibold">Akomodasi</th><th class="pb-3 text-right font-semibold">Pax</th><th class="pb-3 text-right font-semibold">Harga / pax</th></tr></thead><tbody>${offerRows.map(item=>`<tr class="border-t border-stone-100"><td class="py-3"><span class="font-semibold text-ink">${escapeHTML(item.kind==="hotel" ? item.row.city || "Hotel" : item.row.name || "Apartemen")}</span><span class="ml-1 text-stone-400">${escapeHTML(item.row.category || item.row.city || "")}</span></td><td class="py-3 text-right text-stone-500">${integer(item.people)} orang</td><td class="py-3 text-right font-bold text-brand-700">${fmt(item.sellPerPax*num(data.exchange),"IDR")}</td></tr>`).join("")}</tbody></table></div>` : `<div class="rounded-xl bg-stone-50 p-5 text-center text-xs text-stone-500">Tambahkan akomodasi dan alokasi pax untuk menampilkan harga.</div>`}</div>
          <div class="rounded-xl bg-stone-50 p-4"><h3 class="mb-2 text-xs font-bold text-ink">Informasi paket</h3><p class="text-xs leading-relaxed text-stone-500">Harga dapat berubah mengikuti ketersediaan dan kurs. Silakan hubungi ${escapeHTML(data.company || "travel kami")} untuk informasi lebih lanjut.</p></div>
          <p class="mt-6 text-center text-[10px] text-stone-400">Disiapkan dengan Rihlah · Kalkulator HPP Umroh</p>
        </div>`)}
      </div>`;
    }
    function render() {
      document.getElementById("page-title").textContent = labels[currentPage][1];
      document.getElementById("breadcrumb").textContent = labels[currentPage][0];
      document.querySelectorAll(".nav-link").forEach(link => link.classList.toggle("active", link.dataset.page === currentPage));
      app.innerHTML = currentPage === "overview" ? renderOverview() :
        currentPage === "hotel" ? renderTable("hotel") :
        currentPage === "apartments" ? renderTable("apartments") :
        currentPage === "transport" ? renderTable("transport") :
        currentPage === "other-costs" ? renderSettings() : renderOffer();
    }
    function refreshCalculated() {
      const s = summary();
      for (const item of s.rows) {
        const cell = document.querySelector(`[data-result="${item.kind}:${item.row.id}"]`);
        if (cell) cell.textContent = fmt(item.costPerPax);
      }
      for (const row of data.transport) {
        const total = num(row.price) * num(row.units);
        const totalCell = document.querySelector(`[data-transport-total="${row.id}"]`);
        const perCell = document.querySelector(`[data-transport-per="${row.id}"]`);
        if (totalCell) totalCell.textContent = fmt(total);
        if (perCell) perCell.textContent = fmt(num(row.pax) ? total / num(row.pax) : 0);
      }
      if (currentPage === "overview") render();
      if (currentPage === "other-costs") {
        const markup = document.getElementById("settings-markup");
        const progress = document.getElementById("markup-progress");
        if (markup) markup.textContent = `${integer(num(data.markup))}%`;
        if (progress) progress.style.width = `${Math.min(100,num(data.markup))}%`;
      }
    }
    function addRow(kind) {
      const defaults = {
        hotel: { id:id(), city:"", category:"", price:0, nights:0, rooms:0, pax:0, capacity:4, meal:0, mealDays:0 },
        apartments: { id:id(), city:"", name:"", price:0, days:num(data.duration), units:0, capacity:6, pax:0, meal:0, mealDays:0 },
        transport: { id:id(), route:"", description:"", price:0, units:0, pax:num(data.pax) }
      };
      const collection = kind === "hotel" ? "hotels" : kind;
      data[collection].push(defaults[kind]);
      scheduleSave();
      render();
      save();
      const firstInput = app.querySelector(`[data-scope="${kind}"][data-id="${defaults[kind].id}"]`);
      if (firstInput) firstInput.focus();
    }
    function openPage(page) {
      if (!labels[page]) return;
      currentPage = page;
      render();
      window.scrollTo({ top:0, behavior:"smooth" });
      closeMenu();
    }
    function closeMenu() {
      document.getElementById("sidebar").classList.add("-translate-x-full");
      document.getElementById("sidebar-backdrop").classList.add("hidden");
    }
    app.addEventListener("input", event => {
      const target = event.target;
      if (!target.matches("[data-scope][data-key]")) return;
      const { scope, key, id: rowId } = target.dataset;
      let value = target.value;
      if (target.type === "number") {
        value = num(value);
        target.value = value;
      }
      if (scope === "settings") {
        data[key] = value;
        if (key === "exchange") {
          exchangeRequestId++;
          exchangeLoading = false;
          exchangeError = "";
          data.exchangeSource = "manual";
          updateExchangeStatus();
        }
      } else if (scope === "direct" || scope === "shared") data[scope][key] = value;
      else {
        const collection = scope === "hotel" ? "hotels" : scope;
        const row = data[collection].find(item => item.id === rowId);
        if (row) row[key] = value;
      }
      scheduleSave();
      refreshCalculated();
    });
    document.addEventListener("click", event => {
      const pageLink = event.target.closest("[data-page], [data-page-link]");
      if (pageLink) {
        openPage(pageLink.dataset.page || pageLink.dataset.pageLink);
        return;
      }
      const action = event.target.closest("[data-action]");
      if (!action) return;
      if (action.dataset.action === "refresh-exchange") {
        refreshExchangeRate(true);
        return;
      }
      if (action.dataset.action === "add-hotel") addRow("hotel");
      if (action.dataset.action === "add-apartments") addRow("apartments");
      if (action.dataset.action === "add-transport") addRow("transport");
      if (action.dataset.action === "remove-row") {
        const stateKey = action.dataset.kind === "hotel" ? "hotels" : action.dataset.kind;
        data[stateKey] = data[stateKey].filter(row => row.id !== action.dataset.id);
        scheduleSave();
        render();
      }
      if (action.dataset.action === "print") window.print();
      if (action.dataset.action === "reset") {
        if (window.confirm("Mulai paket baru? Data paket saat ini akan dihapus dari browser.")) {
          data = clone(initialData);
          scheduleSave();
          showToast("Paket baru siap diisi.");
          render();
        }
      }
    });
    document.getElementById("menu-button").addEventListener("click", () => {
      document.getElementById("sidebar").classList.remove("-translate-x-full");
      document.getElementById("sidebar-backdrop").classList.remove("hidden");
    });
    document.getElementById("sidebar-backdrop").addEventListener("click", closeMenu);
    render();
    if (data.exchangeSource === "api") refreshExchangeRate();
  </script>
</body>
</html>
